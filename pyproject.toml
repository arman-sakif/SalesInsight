[project]
name = "salesinsight"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.11.9",
    "dbt-duckdb>=1.10.1",
    "duckdb>=1.5.2",
    "faker>=40.15.0",
    "kagglehub>=1.0.1",
    "mcp[cli]==1.14.0",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "python-dotenv>=1.2.2",
    "streamlit>=1.61.1",
]

[tool.hatch.build.targets.wheel]
packages = ["mcp_server", "ingestion"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.ruff]
# extend-exclude, not exclude: exclude would replace ruff's built-in list
# (.venv, __pycache__, ...) and send the linter into the virtualenv.
extend-exclude = ["dbt_project/target", "dbt_project/dbt_packages"]

[tool.ruff.lint.per-file-ignores]
# The Streamlit entrypoints put the repo root on sys.path before importing
# mcp_server, so their imports intentionally sit below that bootstrap.
"app/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
