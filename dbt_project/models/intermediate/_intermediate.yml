version: 2

models:
  - name: int_orders_enriched
    description: "Orders joined with product and customer data, with derived metrics"
    columns:
      - name: order_id
        tests:
          - not_null
      - name: sales_amount
        tests:
          - not_null

  - name: int_customer_segments
    description: "RFM scored customers with segment labels"
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique