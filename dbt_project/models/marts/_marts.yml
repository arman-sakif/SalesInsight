version: 2

models:
  - name: fact_sales
    description: "One row per order line. Central fact table for all sales analysis."
    columns:
      - name: order_id
        tests:
          - not_null
      - name: customer_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: sales_amount
        tests:
          - not_null

  - name: dim_customer
    description: "One row per customer with RFM segment."
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique

  - name: dim_product
    description: "One row per product with category hierarchy."
    columns:
      - name: product_id
        tests:
          - not_null
          - unique

  - name: dim_date
    description: "Date spine covering all order dates."
    columns:
      - name: date_day
        tests:
          - not_null
          - unique

  - name: dim_region
    description: "One row per region with state and city counts."
    columns:
      - name: region
        tests:
          - not_null
          - unique